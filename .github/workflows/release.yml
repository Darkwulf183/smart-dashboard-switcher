name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check manifest version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(jq -r .version custom_components/smart_dashboard_switcher/manifest.json)
          if [ "$tag" != "$ver" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $ver"
            exit 1
          fi

      - name: Build zip
        run: |
          cd custom_components/smart_dashboard_switcher
          zip -r "$GITHUB_WORKSPACE/smart_dashboard_switcher.zip" . -x '__pycache__/*'

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=.github/release-notes.md
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" smart_dashboard_switcher.zip --title "$GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" smart_dashboard_switcher.zip --title "$GITHUB_REF_NAME" --generate-notes
          fi
