name: Release

# Actions → Release → "Run workflow".
# Reads the version from manifest.json, creates tag v<version>,
# the GitHub release (notes from .github/release-notes.md) and attaches a zip.
on:
  workflow_dispatch:
    inputs:
      replace:
        description: "Replace an existing release with the same version (deletes the old release and tag)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: echo "tag=v$(jq -r .version custom_components/smart_dashboard_switcher/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Build zip
        run: |
          cd custom_components/smart_dashboard_switcher
          zip -r "$GITHUB_WORKSPACE/smart_dashboard_switcher.zip" . -x '__pycache__/*'

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "${{ inputs.replace }}" = "true" ]; then
              echo "Replacing existing release $TAG"
              gh release delete "$TAG" --yes --cleanup-tag
            else
              echo "::error::Release $TAG already exists - raise the version in manifest.json first"
              exit 1
            fi
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            if [ "${{ inputs.replace }}" = "true" ]; then
              git push origin ":refs/tags/$TAG"
            else
              echo "::error::Tag $TAG already exists"
              exit 1
            fi
          fi
          gh release create "$TAG" smart_dashboard_switcher.zip \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file .github/release-notes.md
